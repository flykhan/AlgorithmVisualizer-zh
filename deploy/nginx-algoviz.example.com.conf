# algoviz.example.com — 反向代理到 algoviz 静态站点容器（127.0.0.1:19090）
# 源仓库: https://github.com/flykhan/AlgorithmVisualizer-zh
# 镜像:   flykhan/algoviz:latest （容器内 nginx 提供 Next.js 静态导出文件）

server {
    listen 80;
    listen [::]:80;
    server_name algoviz.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name algoviz.example.com;

    ssl_certificate     /etc/nginx/cert/cert.crt;
    ssl_certificate_key /etc/nginx/cert/private.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 5m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    charset utf-8;

    access_log /var/log/nginx/algoviz.access.log;
    error_log  /var/log/nginx/algoviz.error.log;

    # 静态文件与缓存头由容器内 nginx 负责，这里只做 TLS 终结与转发
    location / {
        proxy_pass http://127.0.0.1:19090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
