# 容器内 nginx 配置（nginx:alpine 的 /etc/nginx/conf.d/algoviz.conf）
# 只负责提供 Next.js 静态导出文件；TLS 由宿主机 nginx 终结后反代到本容器 80 端口。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # 位于反向代理之后：避免 301 跳出内部地址
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/xhtml+xml;

    # Next.js 带 hash 的构建产物：长缓存
    location /_next/static/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # Next.js 静态导出：/sorting -> sorting.html，RSC 载荷走 sorting.txt
    location / {
        try_files $uri $uri.html $uri/ =404;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
